# ============================================================
# Experiment Configuration
# ============================================================
# - Fixed hyperparameters go here.
# - Variable dimensions (model, seed, prompt, ...) go in run_slurm.sh GRID_ARGS.
# - Do NOT hardcode values you intend to sweep.
# ============================================================

# --- Hyperparameters ---
seed: 42
# train_sample_sizeは0011(OPQ+IVF+PQ学習、未作成)の入力になる。OPQ学習コストは
# おおよそ学習ベクトル数に比例して増えるため、大きくしすぎない
# (500,000は目安。nlist=4096に対しては十分な比率 — FAISSの目安は
# クラスタあたり数十〜数百点で、500,000/4096≈122点/クラスタ)。
#
# 2026-08-22: チーム方針により、コーパス側・クエリ側の両方をコーパス内の
# 平均的な染色パッチ(data/baseline/63958_x38976_y7616.png、
# scripts/select_average_patch.pyで選定済み)を基準にMacenkoで正規化した
# 新コーパスを使う。エンコーダ(uni_v1)・パッチサイズ(224px)は0001から
# 変更しない — 変わるのは染色正規化の有無のみ。
# この再エンベディング自体はこのリポジトリの範囲外(wsi_preprocessパイプライン
# で実施、torchstain 1.4.1 の NumpyMacenkoNormalizer + デフォルトパラメータ)。
# (data/trident_processed_macenko は別件のuni_v2・256px・正規化方法不明の
# コーパスなので流用不可)
#
# READMEの「クエリ側染色正規化の再検証(2026-08-20)」は染色正規化を非推奨と
# しているが、そこでの否定的結果はすべて交絡付き(uni_v2はエンコーダ・パッチ
# サイズも同時に変化、クエリ側torchstain検証は未正規化コーパスに正規化クエリを
# 当てるパイプライン不一致)。今回は「uni_v1・ジオメトリ完全一致・両側正規化・
# 自己一致性検証済み」の交絡なし再検証。GT比較(scripts/validate_against_ground_truth.py)
# でbaseline_v1を上回らなければuni_v2同様に棚上げする。
features_dir: "data/trident_processed_uni_v1_macenko/20x_224px_0px_overlap/features_uni_v1_macenko"
train_sample_size: 500000

# wsi_preprocessの監査パス(scripts/audit_stain_norm_failures.py)が出力する
# stain_norm_failures.json。Macenko正規化に失敗し生パッチのまま埋め込まれた
# パッチをmanifest・slide_meta・学習サンプルから除外し、コーパスを100%正規化済み
# にする。全体失敗率が記録された閾値を超えているとbuild_patch_manifestがraiseする。
#
# 2026-09-04: wsi_preprocess側の判断により、1000スライドのフル監査と
# フルstain_norm_failures.jsonは生成しない。サンプル監査(32/1000スライド、seed 0)
# の結果:
#   - 推定・全体失敗率 0.81%(閾値1%未満)、スライド処理失敗 0
#   - 失敗パッチ4800件の mean OD 内訳: background 99.9% / sparse 0.1% / tissue 0.0%
#   - 失敗はすべて実質白背景。脂肪変性・壊死など探索対象の所見領域にはゼロ。
# よって混在する約0.8%の素通しパッチは純粋背景で、tissueクエリの検索に実害なし。
# stain_norm_failures.sample.json は32スライドしかカバーせず全コーパスに一貫適用
# できないため manifest には渡さない(uni_v2の「半汚染」問題とは異なり、こちらは
# 素通し分が背景限定であることを監査で確認済み)。
# 参照用診断成果物: data/trident_processed_uni_v1_macenko/stain_norm_failures.sample.json
#   および同 stain_norm_failure_inspect/(failure_patches.csv, montage_by_od.png, overlay/)
#
# 値なし(= None)にして除外処理を無効化する。experiment.py は
# config.get("stain_norm_failures_path") が falsy なら stain_norm_failures_path
# を渡さず、manifest は連続 local_idx のまま構築される。キー自体は
# preflight_check.py の config/experiment.py 整合チェックのため残す。
stain_norm_failures_path:
