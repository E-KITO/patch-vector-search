# ============================================================
# experiments/0027: atlas GT 悪化の図版単位切り分け診断
# ============================================================
# experiments/0025 で whiten 索引(異方性除去)は self_retrieval(コーパス内検索)を
# 大きく改善する一方、atlas GT(7カテゴリ)の best_rank を悪化させた。この repo の
# 目的上 atlas クエリの検索精度こそが本丸であり、self_retrieval の改善だけでは
# 意味がない。ただし 0025/0026 の atlas_gt_*.csv はカテゴリ単位(そのカテゴリの
# 全図版タイルを1回のマルチタイルクエリに束ねた結果)でしか記録されておらず、
# 悪化が「特定の外れ値図版1枚」に集中しているのか「カテゴリ全体に一様」に効いて
# いるのかが分からない。
#
# ここでは scripts/atlas_per_image_diagnostic.py で図版1枚ずつ個別にクエリし、
# baseline(0018)と whiten(0025 full whiten)を並べて best_rank を比較する。
# 索引はどちらも既存のもの(再構築なし)を使う — 計算コストは埋め込み
# (~29図版 x 1回)+ FAISS 検索(~29図版 x 2索引)のみ。
#
# 見たいもの:
#   - 悪化(whiten_best > base_best)が少数の図版に集中していれば → atlas 側の
#     前処理(染色・スキャン条件など)起因の外れ値の疑い。
#   - 悪化がカテゴリ内の図版に広く一様に出ていれば → 変換自体が corpus-fit の
#     異方性除去を OOD(atlas)クエリに適用すること自体と構造的に相性が悪い
#     (ドメインギャップ由来のノイズ増幅)の疑いが強まる。
# ============================================================

seed: 42

index_dirs:
  baseline: "outputs/0018_20260909_build_faiss_index_deblank/default"
  whiten: "outputs/0025_20260910_whiten_index_rebuild/default/whiten_v1"

nprobe: 64
