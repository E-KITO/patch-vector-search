# ============================================================
# Experiment Configuration
# ============================================================
# 0015: 0014 の変種。0014 は NNL アトラス図版をクエリにしたが、GT スライドを
# ほとんど引けなかった(アトラス→TG-GATEs のドメインギャップが #1 ブロッカーと
# 判明)。0015 は **自己検索で動くと分かっている側**を seed にする:
#
#   - その所見の確定単一所見スライド(single_finding_liver.csv ∩ コーパス)を
#     seed_fraction で seed / hold-out に分割
#   - seed スライドのパッチ特徴量を h5 からそのまま読んでクエリにする
#     (UNI エンコーダは呼ばない)
#   - seed スライドを検索結果から除外
#   - gt_positive_slide フラグは **hold-out GT スライド**につく(= recall の指標)
#
# curation パイプラインは lib/patch_set.py に切り出した(0014 のインライン版と
# 同一ロジック。0014 は凍結記録なので retrofit しない)。
# ============================================================

# --- Hyperparameters ---
seed: 42

index_exp_dir: "outputs/0002_20260808_build_faiss_index/default"
features_dir: "data/trident_processed/20x_224px_0px_overlap/features_uni_v1"
raw_slide_dir: "data/moo_collected_tggate_wsi/raw_wsi"
gt_csv: "data/processed_csv/single_finding_liver.csv"

# --- seed / hold-out 分割 ---
# その所見の GT スライドのうち seed に回す割合(残りは hold-out で recall 測定用)。
seed_fraction: 0.5
# seed スライド 1 枚あたりクエリに使うパッチ数(h5 からランダムサンプル)。
n_query_patches_per_seed_slide: 400

# --- 検索パラメータ ---
nprobe: 64
k_candidate_patches: 5000
rerank_pool: 1000
max_tiles_reranked: null

# --- productization レイヤー(lib/patch_set.py) ---
sim_floor: 0.40
nms_radius_patches: 1.5
max_per_slide: 15
target_n_patches: 150
