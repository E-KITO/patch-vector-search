# ============================================================
# experiments/0048: deliverモード候補プール構造の一括分析
# (README「次の一手」#4: deliverモードの候補枯れ対策)
# ============================================================
# experiments/0015/0019のdeliverモード(GTスライド全体をseedにして検索→除外→
# curation)は、glycogen(137/150)・ground glass(113/150)ともtarget 150に
# 未達だった。ただし未達の中身は違う: glycogenは候補プール自体が薄い構造的な
# 頭打ち(174候補→137枚)、ground glassは上位スライドが上限に達した「多様性が
# 尽きた」形(295候補→113枚、GT4枚の稀少所見としては妥当)。
#
# `k_candidate_patches`を上げる前に、target=150という一律の目標値が所見ごとに
# 現実的かを判断する材料が要る。この実験は、GT対応7所見(コーパス内に確定
# ラベルがある所見)全部について、実際のパッチ画像を切り出さずに(raw WSI
# クロップ・コンタクトシート生成をスキップ)、候補プールの段階別カウント
# (`lib.patch_set.curate_candidates`が返す診断値、experiments/0015/0019と
# 同一の考え方)だけを一括で集計する。
#
# シード側のクエリ埋め込みはGTスライド自身の既存h5特徴量を直読みするだけ
# (`load_slide_query_vecs`、UNIエンコーダ不使用)、検索は faiss-cpu のみで
# GPU不要——experiments/0015/0019自体も元々CPUのみで実行されていた
# (run_slurm.shに--gres=gpuが無い)。
#
# 注意: build_patch_set本来のblank_overfetch(空白クロップ除外を見込んだ
# 多め取得)は行わない(パッチを切り出さないため空白判定ができない)。
# glycogen/ground glassは空白除外が0〜3%とわずかだが、granular
# eosinophilicは70%が空白だった実績があるため、この分析の
# n_after_nms_and_capはgranular系所見では実際の成果物枚数をやや過大評価する
# 可能性がある(下記summary.csvの注記参照)。
# ============================================================

seed: 42

target_findings:
  - "Hypertrophy"
  - "Single cell necrosis"
  - "Increased mitosis"
  - "Deposit, glycogen"
  - "Hematopoiesis, extramedullary"
  - "Proliferation, Kupffer cell"
  - "Inclusion body, intracytoplasmic"

index_exp_dir: "outputs/0018_20260909_build_faiss_index_deblank/default"
features_dir: "data/trident_processed/20x_224px_0px_overlap/features_uni_v1"
gt_csv: "data/processed_csv/single_finding_liver.csv"

# --- seed構成・検索・curationパラメータ(experiments/0015・0019と同一) ---
max_seed_slides: 6
n_query_patches_per_seed_slide: 120
nprobe: 64
k_candidate_patches: 5000
rerank_pool: 5000
max_tiles_reranked: null
sim_floor: 0.65
nms_radius_patches: 1.5
max_per_slide: 15
target_n_patches: 150
