# ============================================================
# experiments/0044: Macenko染色ベクトル推定を「パッチごと」vs「スライド全体
# (パッチ多数プール)で1回」で比較する事前検証(小規模、コーパス再構築なし)
# ============================================================
# ユーザー提案(図版・スライド全体を1回でMacenko正規化してからタイル分割する
# 案)の事前検証。現行は224pxパッチ1枚ごとに独立して染色ベクトル(HERef)・
# 最大濃度(maxCRef)を推定している(wsi_preprocessのコーパス構築・
# lib.torchstain_normalize.normalize_to_referenceのクエリ側とも同じ粒度)。
# これをスライド単位のfitに変えると安定するのではないか、という仮説を、
# 実際に全コーパスを再構築する前に小規模に検証する。
#
# 当初JPGサムネイル(data/trident_processed/thumbnails/)をスライド単位fitの
# 入力に使う案を検討したが、JPEG圧縮・ダウンサンプリング時の画素混合が
# 「.svsから直接パッチを切り出す現行パイプライン」と異なる色処理経路になり、
# 「パッチ単位 vs スライド単位」という本来の比較軸に「.svs直接 vs JPG経由」
# という別の交絡が混入するため却下した。この実験では**同じ.svsから
# lib.raw_patch.crop_patchで直接切り出したパッチのみ**を使い、(a)パッチごとに
# 個別にfit(現行方式)と、(b)同じスライドの複数パッチを1枚に連結してから
# 1回だけfit(スライド単位方式)を比較する——色処理経路を完全に同一にした
# 上で、fitに使うピクセル量(粒度)だけを変える。
#
# GPU不要(torchstainのNumpy実装のみ、UNIエンコーダは呼ばない)。
# wsi_preprocessも不要(既存のcrop_patch + torchstainで完結)。
# ============================================================

seed: 42

index_dir: "outputs/0018_20260909_build_faiss_index_deblank/default"
raw_slide_dir: "data/moo_collected_tggate_wsi/raw_wsi"

n_slides: 30
n_patches_per_slide: 20
tile_size: 224
